networks:
  debug:
    driver: bridge
    name: debug
services:
  identifier:
    ports:
      - "80:80"
    restart: "no"
  dispatcher:
    restart: "no"
    networks:
      - default
      - debug
  database:
    restart: "no"
    networks:
      - default
      - debug
  virtuoso:
    restart: "no"
    networks:
      - default
      - debug
  resource:
    restart: "no"
  cache:
    restart: "no"
  file:
    restart: "no"
  migrations:
    restart: "no"
  deltanotifier:
    restart: "no"
  frontend-yasgui:
    restart: "no"
  frontend-harvesting:
    restart: "no"
  oslo-eli-transformer:
    restart: no
  job-controller:
    restart: no
  harvest_diff:
    restart: no
  harvest_sameas:
    restart: no
  login:
    restart: no
  entity-linking:
    restart: "no"
  pdf-content:
    restart: "no"
  apache-tika:
    restart: "no"
  search:
    restart: no
    profiles:
      - search
  elasticsearch:
    restart: no
    profiles:
      - search
  municipality-linker:
    restart: no
    profiles:
      - search
  embedding:
    restart: no
    profiles:
      - search
  ollama:
    restart: no
    profiles:
      - search
  pdf-scraper:
    restart: "no"
  nominatim:
    restart: "no"
  named-entity-recognition:
    restart: "no"
  kibana:
    restart: no
    profiles:
      - search
    image: docker.elastic.co/kibana/kibana:9.2.0
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
    ports:
      - 127.0.0.1:5601:5601
    user: root
    command: |
      sh -c "/usr/local/bin/kibana-docker --allow-root;"
